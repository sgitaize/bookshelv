# bookshelv – nginx vor dem Node-Dienst (127.0.0.1:PORT). Platzhalter __HOST__ / __PORT__ ersetzt setup.sh.
limit_req_zone  $binary_remote_addr zone=bs___PORT___req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=bs___PORT___conn:10m;

map $http_upgrade $bs_connection { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
