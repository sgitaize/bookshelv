# bookshelv.de (+ www) → vorerst bookshelv.aize-it.de. Absichtlich 302 (nicht 301): Browser merken sich 301 dauerhaft –
# beim späteren Umzug auf bookshelv.de (dann aize-it.de → bookshelv.de) gäbe das sonst eine Schleife.
server {
    listen 80;
    listen [::]:80;
    server_name bookshelv.de www.bookshelv.de;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 302 https://bookshelv.aize-it.de$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bookshelv.de www.bookshelv.de;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/bookshelv.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookshelv.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 302 https://bookshelv.aize-it.de$request_uri;
}
